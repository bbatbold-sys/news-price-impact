services:
  - type: web
    name: news-pulse-dashboard
    runtime: python
    rootDir: web
    buildCommand: pip install -r requirements_cloud.txt
    startCommand: gunicorn cloud_app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    envVars:
      - key: PYTHONPATH
        value: ..
    plan: free
