services:
  - type: web
    name: news-pulse-dashboard
    runtime: python
    rootDir: pulse
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHONPATH
        value: ..
    plan: free
