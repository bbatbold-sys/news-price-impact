name: News Impact Alerts

on:
  schedule:
    - cron: '*/15 * * * *'   # Every 15 minutes, 24/7
  workflow_dispatch:           # Manual trigger from GitHub UI

jobs:
  poll-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      # ── 1. Checkout repo (includes pre-trained models) ──────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python 3.11 with pip cache ────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Cache HuggingFace FinBERT model (~500 MB, only downloaded once) ───
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-finbert-prosusai-v1

      # ── 4. Install dependencies ──────────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            requests pytz pandas numpy scikit-learn joblib \
            beautifulsoup4 yfinance \
            transformers \
            torch --index-url https://download.pytorch.org/whl/cpu

      # ── 5. Run the poller (email config comes from GitHub Secrets) ───────────
      - name: Poll news and send alerts
        env:
          RECIPIENT_EMAIL:  ${{ secrets.RECIPIENT_EMAIL }}
          SENDER_EMAIL:     ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD:  ${{ secrets.SENDER_PASSWORD }}
          SMTP_HOST:        ${{ secrets.SMTP_HOST }}
          SMTP_PORT:        ${{ secrets.SMTP_PORT }}
          MIN_CONFIDENCE:   ${{ secrets.MIN_CONFIDENCE }}
        run: python cloud_poller.py

      # ── 6. Commit updated seen_urls.json so next run skips processed articles ─
      - name: Save seen URLs
        run: |
          git config user.name  "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add seen_urls.json
          git diff --cached --quiet || git commit -m "chore: update seen_urls [skip ci]"
          git push
