name: News Impact Alerts

on:
  schedule:
    - cron: '*/15 * * * *'   # Every 15 minutes, 24/7
  workflow_dispatch:           # Manual trigger from GitHub UI

jobs:
  poll-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      # ── 1. Checkout repo ─────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Check heartbeat — skip if local poller is running ─────────────────
      #    Local poller writes heartbeat.txt every ~5 min when the computer is on.
      #    If heartbeat is < 10 minutes old → computer is ON → skip this run.
      #    If heartbeat is >= 10 minutes old → computer is OFF → run cloud poller.
      - name: Check local poller heartbeat
        id: heartbeat
        run: |
          if [ -f heartbeat.txt ]; then
            LAST=$(cat heartbeat.txt)
            NOW=$(date +%s)
            AGE=$((NOW - LAST))
            echo "Heartbeat age: ${AGE}s"
            if [ $AGE -lt 600 ]; then
              echo "Local poller is active (${AGE}s ago). Skipping this run."
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "Local poller offline (${AGE}s ago). Running cloud poller."
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "No heartbeat file found. Running cloud poller."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # ── 3. Python 3.11 with pip cache ────────────────────────────────────────
      - name: Set up Python
        if: steps.heartbeat.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 4. Cache HuggingFace FinBERT model ───────────────────────────────────
      - name: Cache HuggingFace models
        if: steps.heartbeat.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-finbert-prosusai-v1

      # ── 5. Install dependencies ──────────────────────────────────────────────
      - name: Install dependencies
        if: steps.heartbeat.outputs.skip == 'false'
        run: |
          pip install --upgrade pip
          pip install requests pytz pandas numpy scikit-learn joblib beautifulsoup4 yfinance transformers matplotlib seaborn xgboost lightgbm optuna
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      # ── 6. Run the cloud poller ───────────────────────────────────────────────
      - name: Poll news and send alerts
        if: steps.heartbeat.outputs.skip == 'false'
        env:
          RECIPIENT_EMAIL:  ${{ secrets.RECIPIENT_EMAIL }}
          SENDER_EMAIL:     ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD:  ${{ secrets.SENDER_PASSWORD }}
          SMTP_HOST:        ${{ secrets.SMTP_HOST }}
          SMTP_PORT:        ${{ secrets.SMTP_PORT }}
          MIN_CONFIDENCE:   ${{ secrets.MIN_CONFIDENCE }}
        run: python cloud_poller.py

      # ── 7. Commit updated seen_urls.json ─────────────────────────────────────
      - name: Save seen URLs
        if: steps.heartbeat.outputs.skip == 'false'
        run: |
          git config user.name  "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add seen_urls.json
          git diff --cached --quiet || git commit -m "chore: update seen_urls [skip ci]"
          git push
